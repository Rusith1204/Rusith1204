<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" font-family="'Courier New', monospace" font-size="15">
  <rect width="800" height="260" rx="10" fill="#0d1117" stroke="#00ff9c" stroke-opacity="0.5"/>
  <rect width="800" height="30" rx="10" fill="#161b22"/>
  <circle cx="20" cy="15" r="6" fill="#ff5f56"/><circle cx="40" cy="15" r="6" fill="#ffbd2e"/><circle cx="60" cy="15" r="6" fill="#27c93f"/>
  <text x="400" y="20" fill="#8b949e" font-size="12" text-anchor="middle">rusith@kali: ~</text>

  <g fill="#00ff9c">
    <text x="20" y="60" opacity="0"><animate attributeName="opacity" to="1" begin="0.3s" dur="0.01s" fill="freeze"/>┌──(rusith㉿kali)-[~]</text>
    <text x="20" y="82" opacity="0"><animate attributeName="opacity" to="1" begin="0.8s" dur="0.01s" fill="freeze"/>└─$ <tspan fill="#e6edf3">whoami</tspan></text>
    <text x="20" y="104" fill="#58a6ff" opacity="0"><animate attributeName="opacity" to="1" begin="1.6s" dur="0.01s" fill="freeze"/>Rusith | Aspiring Ethical Hacker &amp; Security Engineer</text>
    <text x="20" y="132" opacity="0"><animate attributeName="opacity" to="1" begin="2.6s" dur="0.01s" fill="freeze"/>└─$ <tspan fill="#e6edf3">nmap -sV --script vuln target.lab</tspan></text>
    <text x="20" y="154" fill="#8b949e" opacity="0"><animate attributeName="opacity" to="1" begin="3.6s" dur="0.01s" fill="freeze"/>[*] Scanning authorized lab environment...</text>
    <text x="20" y="176" fill="#ffbd2e" opacity="0"><animate attributeName="opacity" to="1" begin="4.4s" dur="0.01s" fill="freeze"/>[!] Finding: outdated service detected -&gt; report &amp; patch</text>
    <text x="20" y="198" fill="#27c93f" opacity="0"><animate attributeName="opacity" to="1" begin="5.2s" dur="0.01s" fill="freeze"/>[+] Mitigation applied. System hardened. ✔</text>
    <text x="20" y="226" opacity="0"><animate attributeName="opacity" to="1" begin="6s" dur="0.01s" fill="freeze"/>└─$ <tspan fill="#e6edf3">echo "Hack ethically. Defend relentlessly."</tspan></text>
    <rect x="20" y="236" width="9" height="14" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
