name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug mode'
        required: false
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Game
        uses: Platane/snk@v3
        with:
          github_user_name: Rusith1204
          svg_out_path: dist/github-snake.svg
          gif_out_path: dist/github-snake.gif
